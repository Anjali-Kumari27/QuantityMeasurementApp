server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            globalcors:
                add-to-simple-url-handler-mapping: true
                cors-configurations:
                    "[/**]":
                        allowedOrigins:
                            - "http://localhost:5173"
                            - "http://localhost:3000"
                            - "http://localhost:5500"
                        allowedMethods:
                            - GET
                            - POST
                            - PUT
                            - DELETE
                            - OPTIONS
                        allowedHeaders:
                            - "*"
                        allowCredentials: true
            routes:
                - id: auth-route
                  uri: lb://user-service
                  predicates:
                      - Path=/api/v1/auth/**
                - id: user-route
                  uri: lb://user-service
                  predicates:
                      - Path=/api/users/**
                - id: quantity-route
                  uri: lb://measurement-service
                  predicates:
                      - Path=/api/v1/quantities/**

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
        registry-fetch-interval-seconds: 5
    instance:
        lease-renewal-interval-in-seconds: 5
        lease-expiration-duration-in-seconds: 10
