#
# UC16: application.properties
#
# This file contains configuration settings for the application.
# It defines database connection details and repository settings.
#
# Key configurations:
# - Database URL
# - Database username and password
# - JDBC driver class
# - Connection pool size
# - Repository type (cache or database)
#
# Keeping configuration here allows the application behavior
# to be modified without changing source code.
#


repository.type=database

db.url=jdbc:h2:mem:quantitydb;DB_CLOSE_DELAY=-1;INIT=RUNSCRIPT FROM 'classpath:db/schema.sql'
db.username=sa
db.password=
db.driver=org.h2.Driver
db.pool.size=3
